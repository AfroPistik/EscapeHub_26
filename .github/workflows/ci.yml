
name: EscapeHub CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: escapehub
          POSTGRES_USER: escapehub
          POSTGRES_PASSWORD: escapehub_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U escapehub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test
    
      run: mvn -B clean verify
 

    - name: Run Static Analysi
      run: mvn spotbugs:check
    - name: Create test database
      run: PGPASSWORD=escapehub_dev psql -h localhost -U escapehub -d escapehub -c "CREATE DATABASE escapehub_test"
 
