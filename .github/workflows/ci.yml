name: EscapeHub CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: escapehub
          POSTGRES_USER: escapehub
          POSTGRES_PASSWORD: escapehub_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U escapehub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create test database
        env:
          PGPASSWORD: escapehub_dev
        run: |
          if ! psql -h localhost -U escapehub -d escapehub -tAc "SELECT 1 FROM pg_database WHERE datname='escapehub_test'" | grep -q 1; then
            psql -h localhost -U escapehub -d escapehub -c "CREATE DATABASE escapehub_test"
          else
            echo "Test database already exists. Skipping creation."
          fi

      - name: Build and Test
        run: mvn -B clean verify
